<svg xmlns="http://www.w3.org/2000/svg" width="464" height="232" viewBox="0 0 464 232" role="img" aria-labelledby="title desc">
  <title id="title">pid-acp</title>
  <desc id="desc">Zed, acpx, Buzz, and matrix-acp-bridge communicate over ACP with pid-acp, which embeds Pi Durable and uses pi-mcp, pi-codemode, and pi-ai.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="464" height="232" rx="12" fill="#f8fafc"/>
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="20" y="29" width="168" height="174" rx="8" fill="#fff"/>
    <rect x="244" y="20" width="200" height="192" rx="8" fill="#dbeafe"/>
    <rect x="264" y="64" width="160" height="128" rx="8" fill="#fff"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M192 116H240" marker-start="url(#arrow)"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="bold">
      <text x="104" y="59">ACP client</text>
      <text x="344" y="47">pid-acp</text>
      <text x="344" y="92">Pi Durable</text>
    </g>
    <g font-size="15">
      <text x="104" y="91">Zed</text>
      <text x="104" y="116">acpx</text>
      <text x="104" y="141">Buzz</text>
      <text x="104" y="166">matrix-acp-bridge</text>
      <text x="344" y="119">pi-mcp</text>
      <text x="344" y="145">pi-codemode</text>
      <text x="344" y="171">pi-ai</text>
    </g>
    <text x="216" y="103" font-size="12">ACP</text>
  </g>
</svg>
